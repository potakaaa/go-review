<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Goreview — order online (square)</title>
<style>
  @font-face {
    font-family: "Inter Variable";
    src: url("../../public/fonts/inter-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
  }

  :root {
    --canvas: #ffffff;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --subtle: #86868b;
    --glass-tint: rgb(255 255 255 / 70%);
    --glass-border: rgb(255 255 255 / 70%);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #666;
    font-family: "Inter Variable", -apple-system, system-ui, sans-serif;
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
  }

  #poster {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: var(--canvas);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    padding: 72px 72px 66px;
  }

  #poster::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(90% 55% at 80% 2%, #edf0f6 0%, transparent 62%);
  }

  .wordmark {
    position: relative;
    z-index: 2;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.035em;
  }
  .wordmark .light { font-weight: 400; }
  .wordmark .dot { color: var(--muted); }

  .eyebrow {
    position: relative;
    z-index: 2;
    margin-top: 52px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  h1 {
    position: relative;
    z-index: 2;
    margin-top: 16px;
    font-size: 74px;
    font-weight: 600;
    line-height: 1.02;
    letter-spacing: -0.033em;
  }
  h1 .accent { color: var(--muted); }

  .body {
    position: relative;
    z-index: 2;
    margin-top: 22px;
    max-width: 700px;
    font-size: 21px;
    line-height: 1.5;
    letter-spacing: -0.003em;
    color: var(--muted);
  }

  /* --- product cluster --- */
  .stage {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glow {
    position: absolute;
    width: 760px;
    height: 420px;
    border-radius: 50%;
    filter: blur(62px);
    background:
      radial-gradient(circle at 18% 40%, rgb(66 133 244 / 70%), transparent 55%),
      radial-gradient(circle at 82% 60%, rgb(225 48 108 / 52%), transparent 55%),
      radial-gradient(circle at 52% 24%, rgb(250 188 5 / 40%), transparent 52%),
      radial-gradient(circle at 38% 82%, rgb(52 168 83 / 42%), transparent 55%);
  }

  .panel {
    --card-w: 126px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 36px 42px;
    border-radius: 44px;
    border: 1px solid var(--glass-border);
    background: var(--glass-tint);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    backdrop-filter: blur(26px) saturate(180%);
    box-shadow:
      inset 0 1px 0 rgb(255 255 255 / 90%),
      inset 0 -1px 0 rgb(0 0 0 / 4%),
      0 0 0 1px rgb(29 29 31 / 7%),
      0 2px 4px rgb(29 29 31 / 5%),
      0 28px 70px rgb(29 29 31 / 13%);
  }

  .panel::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(120% 100% at 15% -40%, rgb(255 255 255 / 85%), transparent 55%);
    pointer-events: none;
  }

  .panel img {
    position: relative;
    z-index: 1;
    display: block;
    filter: drop-shadow(0 18px 30px rgb(29 29 31 / 24%));
  }

  /* The flagship stands beside the tap cards held as one fanned hand. Each
     card pivots about a point below its own bottom edge, so the tops splay
     while the bottoms stay gathered -- the thing that makes a fan read as a
     fan rather than three sheared rectangles. Mirrors components/card-fan.tsx. */
  .standee { height: 318px; }

  .fan {
    position: relative;
    z-index: 1;
    width: calc(var(--card-w) * 3.15);
    height: calc(var(--card-w) * 1.62);
  }

  .fan .card {
    position: absolute;
    top: 50%;
    left: 50%;
    width: var(--card-w);
    height: auto;
    margin-left: calc(var(--card-w) * -0.5);
    margin-top: calc(var(--card-w) * -0.667);
    transform-origin: 50% 155%;
  }

  /* Painted in DOM order, so the Google card lands in front unaided. */
  .fan .left { transform: translate(-46%, 4%) rotate(-16deg); }
  .fan .right { transform: translate(46%, 4%) rotate(16deg); }
  .fan .center { transform: translateY(-2%); }

  /* --- footer --- */
  .foot {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
    border-top: 1px solid #e4e4e9;
    padding-top: 30px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 11px;
    padding: 19px 32px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--canvas);
    font-size: 21px;
    font-weight: 500;
    letter-spacing: -0.005em;
    white-space: nowrap;
  }

  .terms {
    text-align: right;
    font-size: 16px;
    line-height: 1.55;
    letter-spacing: -0.002em;
    color: var(--subtle);
  }
</style>
</head>
<body>
  <div id="poster">
    <div class="wordmark">go<span class="light">review</span><span class="dot">.</span></div>

    <p class="eyebrow">New</p>
    <h1>You can now<br /><span class="accent">order online.</span></h1>
    <p class="body">
      Google review standees and tap cards. Choose your quantities on the
      website and we&rsquo;ll confirm the details with you.
    </p>

    <div class="stage">
      <div class="glow"></div>
      <div class="panel">
        <img class="standee" src="../../public/images/goreview-standee-transparent-v3.png" alt="" />
        <div class="fan">
          <img class="card left" src="../../public/images/facebook-tap-card-cutout.png" alt="" />
          <img class="card right" src="../../public/images/instagram-tap-card-cutout.png" alt="" />
          <img class="card center" src="../../public/images/google-tap-card-cutout.png" alt="" />
        </div>
      </div>
    </div>

    <div class="foot">
      <div class="pill">goreview.rald.site <span aria-hidden="true">↗</span></div>
      <p class="terms">
        Standee ₱699 · Tap cards ₱299 each (minimum 3)<br />
        Free delivery within Cagayan de Oro
      </p>
    </div>
  </div>
</body>
</html>
